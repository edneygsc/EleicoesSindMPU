<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleição</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* melhor que height fixa */
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px; /* controla no desktop */
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            box-sizing: border-box;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0078D7;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        button:hover {
            background-color: #005fa3;
        }

        .hidden {
            display: none;
        }

        .resultado {
            margin-top: 15px;
            font-size: 18px;
        }

        /* Ajustes extras para telas muito pequenas */
        @media (max-width: 400px) {
            h1 {
                font-size: 18px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div>
    <h1>Simulador de um Sistema Eleitoral Fraudulento</h1>

    <div class="container">

        <!-- Tela 1 -->
        <div id="tela1">
            <h2>Digite os votos da chapa 1</h2>
            <input type="number" id="votos1" min="0" step="1">
            <button onclick="irParaTela2()">Avançar</button>
        </div>

        <!-- Tela 2 -->
        <div id="tela2" class="hidden">
            <h2>Digite os votos da chapa 2</h2>
            <input type="number" id="votos2" min="0" step="1">
            <button onclick="mostrarResultado()">Ver Resultado</button>
        </div>

        <!-- Tela 3 -->
        <div id="tela3" class="hidden">
            <h2>Resultado das eleições</h2>
            <div class="resultado" id="resultado1"></div>
            <div class="resultado" id="resultado2"></div>
            <div class="resultado" id="vencedor"></div>
            <button onclick="reiniciar()">Nova votação</button>
        </div>

    </div>
</div>

<script>
let chapa1 = 0;
let chapa2 = 0;

function irParaTela2() {
    const valor1 = document.getElementById("votos1").value;

    if (valor1 === "" || valor1 < 0) {
        alert("Digite um número válido para a chapa 1.");
        return;
    }

    chapa1 = parseInt(valor1);

    document.getElementById("tela1").classList.add("hidden");
    document.getElementById("tela2").classList.remove("hidden");
}

function mostrarResultado() {
    const valor2 = document.getElementById("votos2").value;

    if (valor2 === "" || valor2 < 0) {
        alert("Digite um número válido para a chapa 2.");
        return;
    }

    chapa2 = parseInt(valor2);

    let menor = Math.min(chapa1, chapa2);
    let maior = Math.max(chapa1, chapa2);

    document.getElementById("resultado1").innerText = "Chapa 1: " + menor + " votos";
    document.getElementById("resultado2").innerText = "Chapa 2: " + maior + " votos";

    if (menor === maior) {
        document.getElementById("vencedor").innerText = "Empate!";
    } else {
        document.getElementById("vencedor").innerText = "Vencedor: Chapa 2";
    }

    document.getElementById("tela2").classList.add("hidden");
    document.getElementById("tela3").classList.remove("hidden");
}

function reiniciar() {
    document.getElementById("votos1").value = "";
    document.getElementById("votos2").value = "";
    document.getElementById("tela3").classList.add("hidden");
    document.getElementById("tela1").classList.remove("hidden");
}
</script>

</body>
</html>
